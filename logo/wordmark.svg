<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="0.5" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#e0306f"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="0.55" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#e0306f"/>
    </linearGradient>
    <clipPath id="sc"><circle cx="200" cy="200" r="130"/></clipPath>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <circle cx="200" cy="200" r="130" fill="url(#sun)"/>
    <g clip-path="url(#sc)" fill="#140f2e">
      <rect x="60" y="215" width="280" height="6"/>
      <rect x="60" y="240" width="280" height="9"/>
      <rect x="60" y="268" width="280" height="12"/>
      <rect x="60" y="300" width="280" height="15"/>
    </g>
    <text x="200" y="262" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="210" fill="#fff" transform="skewX(-9) translate(30 0)">F</text>
    <text x="380" y="262" font-family="Inter Display" font-weight="900" font-size="190" fill="#ffffff" transform="skewX(-9) translate(40 0)" letter-spacing="-4">FALLZ</text>
    <text x="1005" y="262" font-family="Inter Display" font-weight="900" font-size="190" fill="url(#txt)" transform="skewX(-9) translate(40 0)" letter-spacing="-4">MEDIA</text>
  </g>
</svg>
